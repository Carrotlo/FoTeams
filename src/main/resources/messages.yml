# Edit optional item icons here. Remove any :icon: token to hide it.
# Unsupported servers, older Java clients, and Bedrock players automatically receive clean text without item sprites.
tokens:
  prefix: ":diamond_helmet: {theme}FoTeams &8» {muted}"
  theme: "#03fc88"
  muted: "#a7b8b0"
  white: "#ffffff"
  good: "#3ecf8e"
  bad: "#ff5d73"
help-player:
  - "{prefix}{white}/team {muted}- open your team dashboard"
  - "{prefix}{white}/team create <name> {muted}- create a new team"
  - "{prefix}{white}/team invite <player> {muted}- invite a player"
  - "{prefix}{white}/team invites {muted}- list pending outgoing invites"
  - "{prefix}{white}/team revoke <player> {muted}- revoke a pending invite"
  - "{prefix}{white}/team join <team> {muted}- join a team you were invited to"
  - "{prefix}{white}/team leave {muted}- leave your team"
  - "{prefix}{white}/team disband {muted}- disband your team"
  - "{prefix}{white}/team kick <player> {muted}- remove a member or admin from your team"
  - "{prefix}{white}/team promote <player> {muted}- promote a member to admin"
  - "{prefix}{white}/team demote <player> {muted}- demote an admin to member"
  - "{prefix}{white}/team pvp [on|off] {muted}- toggle teammate damage protection"
  - "{prefix}{white}/team ally <team> {muted}- send or accept an ally request"
  - "{prefix}{white}/team unally <team> {muted}- remove an existing alliance"
  - "{prefix}{white}/team chat [message] {muted}- toggle or send team chat"
  - "{prefix}{white}/team allychat [message] {muted}- toggle or send ally chat"
  - "{prefix}{white}/team sethome {muted}- set the team home"
  - "{prefix}{white}/team setwarp <name> [password] {muted}- set a team warp"
  - "{prefix}{white}/team info [team] {muted}- view public team info"
  - "{prefix}{white}/team upgrades {muted}- open team upgrades"
  - "{prefix}{white}/team level [top] {muted}- view team level progress"
help-admin:
  - "{prefix}{white}/teamadmin editor {muted}- open the team editor"
  - "{prefix}{white}/teamadmin reload {muted}- reload configs"
  - "{prefix}{white}/teamadmin version {muted}- check for updates"
  - "{prefix}{white}/teamadmin chatspy {muted}- toggle team chat spy"
